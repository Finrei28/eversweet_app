name: Backend CI

on:
  push:
    branches:
      - "**"
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

jobs:
  quality-checks:
    name: Type-check and security audit
    runs-on: ubuntu-latest

    # The repo holds backend/, frontend/ and admin/, but GitHub only reads
    # workflows from the root .github/, so the job has to step into backend.
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npx tsc --noEmit

      # Gated at critical rather than high because of one unavoidable advisory:
      # @prisma/client pulls prisma -> @prisma/config -> deepmerge-ts <8, a
      # stack-exhaustion DoS. Prisma 7 still pins the vulnerable version and
      # only the Prisma 8 RC changes it, and the affected code is the CLI's
      # config loader, not a path the running server can be driven down.
      # Revisit when Prisma 8 ships stable, then put this back to high.
      - name: Security audit
        run: npm audit --omit=dev --audit-level=critical

  tests:
    name: Unit and integration tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    # The integration suites assert database behaviour — that a unique
    # constraint stops a duplicate order, that a failed transaction rolls back.
    # A mock cannot show either, so CI runs a real Postgres. Redis is stubbed
    # in-process, so no service is needed for it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eversweet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Named with "test" in it deliberately: resetDatabase refuses to truncate
      # a database whose name does not say so.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eversweet_test
      JWT_SECRET: test-jwt-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create the test schema
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          DIRECT_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Run tests
        run: npm test
