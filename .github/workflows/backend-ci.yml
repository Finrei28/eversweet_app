name: Backend CI

on:
  push:
    branches:
      - "**"
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

jobs:
  quality-checks:
    name: Type-check and security audit
    runs-on: ubuntu-latest

    # The repo holds backend/, frontend/ and admin/, but GitHub only reads
    # workflows from the root .github/, so the job has to step into backend.
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npx tsc --noEmit

      # Gated at critical rather than high because of one unavoidable advisory:
      # @prisma/client pulls prisma -> @prisma/config -> deepmerge-ts <8, a
      # stack-exhaustion DoS. Prisma 7 still pins the vulnerable version and
      # only the Prisma 8 RC changes it, and the affected code is the CLI's
      # config loader, not a path the running server can be driven down.
      # Revisit when Prisma 8 ships stable, then put this back to high.
      - name: Security audit
        run: npm audit --omit=dev --audit-level=critical

  tests:
    name: Unit and integration tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    # The integration suites assert database behaviour — that a unique
    # constraint stops a duplicate order, that a failed transaction rolls back.
    # A mock cannot show either, so CI runs a real Postgres. Redis is stubbed
    # in-process, so no service is needed for it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eversweet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Named with "test" in it deliberately: resetDatabase refuses to truncate
      # a database whose name does not say so.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eversweet_test
      JWT_SECRET: test-jwt-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create the test schema
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          DIRECT_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Run tests
        run: npm test

  # The Terms and the Privacy Policy are one file, copied byte-for-byte between this repo
  # and the website. Nothing inside a single repository can prove the two copies match, so
  # this job fetches the other one and compares. Both repos are public, so no token.
  #
  # No `working-directory: backend` default here: the script resolves paths from its own
  # location, and the sibling checkout lands at the workspace root.
  verify-legal:
    name: Legal documents match the website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A paired change lands on a branch of the same name in both repos, and that branch is
      # tried first. Comparing only against the website's main would deadlock the pair: each
      # PR would be checked against a main that does not have the other half yet.
      - name: Check out the website
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Finrei28/eversweet
          ref: ${{ github.head_ref || github.ref_name }}
          path: .eversweet_web
        continue-on-error: true

      - name: Fall back to the website's default branch
        if: hashFiles('.eversweet_web/src/lib/legalDocuments.ts') == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Finrei28/eversweet
          path: .eversweet_web

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # A paired legal change is pushed to two repos, one after the other, and each repo's CI
      # compares against the other. Whichever runs first sees the other half's old copy and
      # fails, though nothing has drifted - it happened on both sides of the same change.
      # So a mismatch is retried: the other repo is fetched again every 30 seconds for about
      # five minutes, same-named branch first, which also picks up a branch pushed after this
      # job started. A real one-sided edit still fails, just not at once.
      - name: Compare the legal documents
        timeout-minutes: 7
        env:
          EVERSWEET_WEB_REPO: ${{ github.workspace }}/.eversweet_web
          SIBLING_DIR: .eversweet_web
          SIBLING_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          attempts=10
          for attempt in $(seq 1 "$attempts"); do
            if node backend/scripts/verify-legal.mjs; then
              exit 0
            fi
            if [ "$attempt" -eq "$attempts" ]; then
              echo "::error::Still different after $attempts attempts - one repo's copy was changed without the other."
              exit 1
            fi
            echo "Attempt $attempt of $attempts: the other copy may not be pushed yet. Fetching it again in 30 seconds."
            sleep 30
            if git -C "$SIBLING_DIR" fetch --depth=1 origin "$SIBLING_BRANCH" 2>/dev/null; then
              git -C "$SIBLING_DIR" checkout --quiet --force FETCH_HEAD
            elif git -C "$SIBLING_DIR" fetch --depth=1 origin HEAD 2>/dev/null; then
              git -C "$SIBLING_DIR" checkout --quiet --force FETCH_HEAD
            else
              echo "Could not fetch the other repo; comparing against what is already checked out."
            fi
          done
